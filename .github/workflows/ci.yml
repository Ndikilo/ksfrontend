name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Lint (eslint via expo lint)
        run: npm run lint

      - name: Tests
        run: npm test

      # No hardcoded user-facing English outside src/i18n/locales (P2.T8).
      - name: Copy gate (i18n)
        run: npm run check:copy
