name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Lint (eslint via expo lint)
        run: npm run lint

      # Tests arrive with P2.T4 (jest-expo/vitest runner); --if-present keeps
      # this step green until then and picks the suite up automatically.
      - name: Tests
        run: npm test --if-present
